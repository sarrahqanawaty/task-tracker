[pytest]
# Put the repository root on sys.path so `tests/conftest.py` can do
# `from app.main import app`. Without this, plain `pytest` fails at collection
# with ModuleNotFoundError: No module named 'app' — only `python -m pytest`
# worked, because that form adds the current directory itself.
# Found by the first CI run, which went red for exactly this reason.
pythonpath = .
testpaths = tests
